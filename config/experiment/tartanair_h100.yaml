# @package _global_

defaults:
  - /dataset@_group_.tartanair: tartanair
  - override /model/encoder: noposplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse, lpips]

wandb:
  project: noposplat-tartanair
  name: tartanair_h100
  tags: [tartanair, 256x256, h100, fine-tune]

model:
  encoder:
    gs_params_head_type: dpt_gs
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    # Foundation MASt3R weights:
    pretrained_weights: '/home/dev/pretrained_weights/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth'
  decoder:
    make_scale_invariant: true

checkpointing:
  # Load the pre-trained RE10K checkpoint to fine-tune on robotics trajectories
  load: '/home/dev/pretrained_weights/re10k.ckpt'
  every_n_train_steps: 5000

dataset:
  tartanair:
    view_sampler:
      warm_up_steps: 20000

optimizer:
  lr: 1e-4
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 16
    num_workers: 8

trainer:
  max_steps: 150000
  val_check_interval: 1000
