# @package _global_

defaults:
  - /dataset@_group_.tartanair: tartanair
  - override /model/encoder: noposplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse, lpips]

wandb:
  project: noposplat-tartanair
  name: tartanair_h100
  tags: [tartanair, 256x256, h100, fine-tune]

model:
  encoder:
    gs_params_head_type: dpt_gs
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    # Warm-started from re10k.ckpt below (no separate MASt3R file needed)
    pretrained_weights: ''
  decoder:
    make_scale_invariant: true

checkpointing:
  # Load the pre-trained RE10K checkpoint to fine-tune on robotics trajectories
  load: 'pretrained_weights/re10k.ckpt'
  every_n_train_steps: 2000

dataset:
  tartanair:
    view_sampler:
      warm_up_steps: 2000

optimizer:
  lr: 5e-5
  warm_up_steps: 500
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 8
    num_workers: 4

trainer:
  max_steps: 20000
  val_check_interval: 500
  gradient_clip_val: 1.0
